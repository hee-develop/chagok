# 무응답·거절 다시 묻기 E2E(docs/reask.md). 서버가 떠 있고 debug 앱이 설치된 에뮬레이터에서 돈다(scripts/e2e-car.sh).
# 질문 카드는 30초(Rules.CARD_TIMEOUT) 동안 대답이 없으면 접히고, 질문을 남겼다가 다음 정차(달린 뒤 넣은 P단) 때 한 번만 다시 묻는다.
# 다시 묻는 카드는 재탑승 한 줄이라 첫 탑승 카드의 오늘 일정 타일·종일 인사("광주 직관 날이에요!")가 없다. 이것으로 두 카드를 가른다.
# 거절("아니")은 다시 묻지 않는다. 신호: now(데모 시계·초기화), trip(소요 시간 초), route=ok, listen=off, gear, enter, heard(아니=%EC%95%84%EB%8B%88).
# 30초를 실제로 기다리므로 이 flow는 약 2분 걸린다. 시간 표기: 시각 사이 공백은 NBSP라 '.'로 받는다. 접힌 지 몇 십 초 뒤라 남은 시간이 39분이 될 수 있다.
appId: com.chagok.car
name: 무응답 다시 묻기
env:
  SHOT_DIR: e2e/output/car
---
- launchApp

# 1. 09:20 첫 탑승 카드(출발 제안, 오늘 일정 타일·종일 인사 있음). 아무 말도 하지 않고 기다린다.
- openLink: chagok-debug://signal?paired=true&now=2026-11-06T00:20:00Z&trip=12000&route=ok&listen=off&gear=P&enter=true
- extendedWaitUntil:
    visible: ".*1시 육전집 점심까지 3시간.40분이에요.*"
    timeout: 20000
- assertVisible: ".*광주 직관 날이에요!.*"
- assertVisible: "오늘 일정"
- takeScreenshot: ${SHOT_DIR}/01-first-card

# 2. 30초가 지나면 카드가 접힌다
- extendedWaitUntil:
    notVisible: ".*육전집 점심까지.*"
    timeout: 45000
- assertNotVisible: "응, 출발"
- takeScreenshot: ${SHOT_DIR}/02-folded-after-30s

# 3. 출발해 달린 뒤 P단에 넣으면 같은 질문을 재탑승 한 줄로 한 번 다시 묻는다(타일·종일 인사 없음)
- openLink: chagok-debug://signal?gear=D
- openLink: chagok-debug://signal?gear=P
- extendedWaitUntil:
    visible: ".*1시 육전집 점심까지 3시간.[34][0-9]분이에요.*"
    timeout: 20000
- assertVisible: "출발할까요?"
- assertVisible: "응, 출발"
- assertNotVisible: "오늘 일정"
- assertNotVisible: ".*광주 직관 날이에요!.*"
- takeScreenshot: ${SHOT_DIR}/03-reask-card

# 4. 다시 묻는 카드도 30초 무응답으로 접힌다. 한 번만 묻는다: 또 달린 뒤 P단에 넣어도 묻지 않는다
#    3단계 P단에서 몇 십 초밖에 안 지났으면 이번 P단은 '잠깐 정차(마지막 P단 뒤 10분 안)'라 한 번만 규칙이 없어도 묻지 않는다.
#    그래서 데모 시계를 15분 앞으로 보내(advance) 잠깐 정차가 아니게 한 뒤 달리고 P단에 넣는다: 이때 묻지 않는 것이 '한 번만'의 효과다.
- extendedWaitUntil:
    notVisible: ".*육전집 점심까지.*"
    timeout: 45000
- openLink: chagok-debug://signal?advance=15
- openLink: chagok-debug://signal?gear=D
- openLink: chagok-debug://signal?gear=P
- takeScreenshot: ${SHOT_DIR}/04-no-second-reask
- assertNotVisible: ".*육전집 점심까지.*"
- assertNotVisible: "응, 출발"

# 5. 거절은 다시 묻지 않는다: 첫 탑승 카드에서 "아니"라고 말하면 접히고, 달린 뒤 P단에서도 묻지 않는다
- openLink: chagok-debug://signal?paired=true&now=2026-11-06T00:20:00Z&trip=12000&route=ok&listen=off&gear=P&enter=true
- extendedWaitUntil:
    visible: ".*1시 육전집 점심까지 3시간.40분이에요.*"
    timeout: 20000
- openLink: chagok-debug://signal?heard=%EC%95%84%EB%8B%88
- extendedWaitUntil:
    notVisible: ".*육전집 점심까지.*"
    timeout: 5000
- openLink: chagok-debug://signal?gear=D
- openLink: chagok-debug://signal?gear=P
- takeScreenshot: ${SHOT_DIR}/05-rejected-no-reask
- assertNotVisible: ".*육전집 점심까지.*"
- assertNotVisible: "응, 출발"

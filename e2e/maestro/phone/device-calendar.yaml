# 실제 기기 캘린더 연결(device 출처). scripts/e2e-phone.sh 가 에뮬레이터에 캘린더를 심고(scripts/seed-phone-calendar.sh)
# Metro를 EXPO_PUBLIC_CALENDAR_SOURCE=device 로 띄운 뒤 아래 env를 넣어 실행한다.
#   APP_ID      Expo Go 번들 ID (Android host.exp.exponent)
#   EXPO_URL    Metro 접속 주소 (exp://...)
#   SERVER_URL  호스트에서 본 서버 주소
# clearState로 권한 허용을 지워 시스템 권한 창이 뜨게 한다.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
# 같은 에뮬레이터를 다른 프로젝트(다른 세션의 Metro)도 쓰면 Expo Go가 우리 주소 대신 다른 프로젝트나 그 개발자 메뉴를 열 수 있다.
# 우리 화면 제목이나 권한 창이 뜨는지 확인하고, 아니면 Expo Go를 끈 뒤 우리 주소(EXPO_URL)를 다시 연다(최대 4번).
- retry:
    maxRetries: 3
    commands:
      - stopApp
      - openLink: ${EXPO_URL}
      # Expo Go 개발자 메뉴 안내를 닫는다(expo-dev-menu.yaml 설명 참고). 화면이 뜨기 전에 권한 창이 먼저 덮을 수 있어
      # 화면 제목이나 권한 버튼 중 하나를 기다린다.
      - runFlow:
          file: expo-dev-menu.yaml
          env:
            SCREEN_TITLE: '(캘린더를 골라 주세요|ALLOW|Allow|허용)'

# 권한 창은 두 겹일 수 있다: Expo Go의 '다른 Expo 앱에 이미 허용했다' 확인 창(대문자 ALLOW)과
# 시스템 캘린더 권한 창(Allow·허용). 영어·한국어 에뮬레이터 모두 받는다.
- runFlow:
    when:
      visible: 'ALLOW'
    commands:
      - tapOn: 'ALLOW'
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- runFlow:
    when:
      visible: '허용'
    commands:
      - tapOn: '허용'
- runFlow:
    when:
      visible: 'ALLOW'
    commands:
      - tapOn: 'ALLOW'

# 권한 창을 닫은 뒤에 개발자 메뉴 안내가 늦게 올라올 수 있어 한 번 더 닫고 화면 제목을 기다린다.
- runFlow:
    file: expo-dev-menu.yaml
    env:
      SCREEN_TITLE: '캘린더를 골라 주세요'

# 심어 둔 캘린더가 목록에 보이고, 소유 캘린더라 기본 선택돼 있다.
- extendedWaitUntil:
    visible: 'ChagokE2E'
    timeout: 30000
# 0개에도 맞는 '.*개'가 아니라 1개 이상일 때만 통과한다(앞 flow가 저장한 목 id 선택 때문에 0개로 시작하면 실패해야 한다).
- assertVisible: '캘린더 [1-9][0-9]*개 연결하기'
- takeScreenshot: 01-device-calendars

- tapOn: '캘린더 [1-9][0-9]*개 연결하기'
- extendedWaitUntil:
    visible: '자주 가는 곳을 알려주세요'
    timeout: 15000
- assertVisible: '2 / 5'
- takeScreenshot: 02-places

# 선택 저장 뒤 폰이 오늘·내일 일정을 보냈는지 서버에서 확인한다.
- runScript:
    file: assert-device-calendar.js
    env:
      SERVER_URL: ${SERVER_URL}

# 폰이 읽을 때 거른 온라인 일정(E2E Online Standup)은 서버로 가지 않지만 3단계와 오늘 탭에는 '이동 없음'으로 흐리게 보인다.
- tapOn: '건너뛰기'
- extendedWaitUntil:
    visible: 'E2E Online Standup'
    timeout: 30000
- assertVisible: '✓ 이동 없음 · 온라인 회의'
- assertVisible: 'E2E Today Meeting'
- takeScreenshot: 03-fill-places-filtered
- tapOn: '나중에 할게요'
# 4단계 '말 거는 방법'은 건너뛰고 5단계(차 연결)로 간다.
- extendedWaitUntil:
    visible: '말 거는 방법을 정해요'
    timeout: 15000
- tapOn: '건너뛰기'
- extendedWaitUntil:
    visible: '차와 연결해요'
    timeout: 15000
- tapOn: '건너뛰기'
# 첫 설정 끝에서 알림 권한을 한 번 묻는다(정책 10.4). 허용으로 답한다.
- runFlow:
    file: notification-allow.yaml
- extendedWaitUntil:
    visible: '오늘 일정'
    timeout: 20000
- extendedWaitUntil:
    visible: 'E2E Online Standup'
    timeout: 20000
- assertVisible: '이동 없음 · 온라인 회의'
- assertVisible: 'E2E Today Meeting'
- takeScreenshot: 04-today-filtered
# 거른 줄을 누르면 확인이 나오고, 취소하면 아무것도 바뀌지 않는다.
- tapOn: 'E2E Online Standup 11:00.*'
- extendedWaitUntil:
    visible: '.*E2E Online Standup.* 일정을 이동 일정으로 바꿀까요\?'
    timeout: 10000
- takeScreenshot: 05-today-filtered-confirm
- tapOn: '취소'
- assertNotVisible: '.*일정을 이동 일정으로 바꿀까요\?'
- assertVisible: '이동 없음 · 온라인 회의'

# ---- 이동 없음 기억(정책서 10.3 4번·10.8) ----
# 1) 오늘 탭에서 일정을 펼쳐 [이동 없음]: 같은 이름 일정을 앞으로 차에 보내지 않는다는 안내와 [되돌리기]가 뜨고 서버에 이름이 기억된다.
- scrollUntilVisible:
    element: 'E2E Today Meeting 13:00.*'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 13:00.*'
- scrollUntilVisible:
    element: 'E2E Today Meeting 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 이동 없음'
- scrollUntilVisible:
    element: 'E2E Today Meeting 되돌리기'
    direction: DOWN
    timeout: 20000
- assertVisible: '.*이동 없음으로 두었어요\. 같은 이름 일정을 앞으로 차에 보내지 않아요\.'
- takeScreenshot: 06-skip-notice
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: remembered
# 2) [되돌리기]: 이동 없음과 이름 기억을 함께 되돌린다.
- tapOn: 'E2E Today Meeting 되돌리기'
- extendedWaitUntil:
    notVisible: 'E2E Today Meeting 되돌리기'
    timeout: 15000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: forgotten
# 3) 다시 [이동 없음]을 누르고 앱을 다시 열면 일정 동기화가 같은 이름 일정을 거른다: 서버로 보내지 않고 오늘 탭에 '이동 없음으로 기억'으로 흐리게 보인다.
- runFlow:
    when:
      notVisible: 'E2E Today Meeting 이동 없음'
    commands:
      - scrollUntilVisible:
          element: 'E2E Today Meeting 13:00.*'
          direction: DOWN
          timeout: 20000
      - tapOn: 'E2E Today Meeting 13:00.*'
- scrollUntilVisible:
    element: 'E2E Today Meeting 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 이동 없음'
- scrollUntilVisible:
    element: 'E2E Today Meeting 되돌리기'
    direction: DOWN
    timeout: 20000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: remembered
- retry:
    maxRetries: 3
    commands:
      - stopApp
      - openLink: ${EXPO_URL}
      - runFlow:
          file: expo-dev-menu.yaml
          env:
            SCREEN_TITLE: '오늘 일정'
- extendedWaitUntil:
    visible: '이동 없음 · 이동 없음으로 기억'
    timeout: 60000
- assertVisible: 'E2E Today Meeting'
- takeScreenshot: 07-today-skipped-row
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: event-withheld
# 4) 그 흐린 줄의 [이동 일정이에요]는 기억을 지운다: 서버에서 기억이 사라지고 같은 일정이 다시 서버로 간다.
- scrollUntilVisible:
    element: 'E2E Today Meeting 13:00.*'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 13:00.*'
- extendedWaitUntil:
    visible: '.*E2E Today Meeting.* 일정을 이동 일정으로 바꿀까요\?'
    timeout: 10000
- tapOn: '바꾸기'
- extendedWaitUntil:
    visible: '.*E2E Today Meeting.* 일정을 이동 일정으로 바꿨어요\.'
    timeout: 30000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: forgotten
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: event-sent
- takeScreenshot: 08-today-unskipped
# 5) 장소를 넣으면 같은 이름의 이동 없음 기억이 지워지고 그 일정은 다시 서버로 간다(장소 보정이 이동 없음 기억을 이긴다).
- runFlow:
    when:
      notVisible: 'E2E Today Meeting 이동 없음'
    commands:
      - scrollUntilVisible:
          element: 'E2E Today Meeting 13:00.*'
          direction: DOWN
          timeout: 20000
      - tapOn: 'E2E Today Meeting 13:00.*'
- scrollUntilVisible:
    element: 'E2E Today Meeting 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 이동 없음'
- scrollUntilVisible:
    element: 'E2E Today Meeting 되돌리기'
    direction: DOWN
    timeout: 20000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: remembered
- scrollUntilVisible:
    element: 'E2E Today Meeting 장소 변경'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Today Meeting 장소 변경'
- extendedWaitUntil:
    visible: '일정 장소 찾기'
    timeout: 15000
- inputText: '육전'
- extendedWaitUntil:
    visible: '.*광주 육전집.*'
    timeout: 15000
- tapOn: '.*광주 육전집.*'
- extendedWaitUntil:
    visible: '오늘 일정'
    timeout: 20000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: forgotten
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: event-sent
- takeScreenshot: 09-today-placed
# 앱을 다시 열어도(일정 동기화) 그 일정은 거르지 않고 장소와 함께 보인다.
- retry:
    maxRetries: 3
    commands:
      - stopApp
      - openLink: ${EXPO_URL}
      - runFlow:
          file: expo-dev-menu.yaml
          env:
            SCREEN_TITLE: '오늘 일정'
- extendedWaitUntil:
    visible: 'E2E Today Meeting 13:00.*'
    timeout: 60000
- assertNotVisible: '이동 없음 · 이동 없음으로 기억'
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Today Meeting'
      STAGE: event-sent
# 6) 장소 탭의 이동 없음 목록: 내일 일정에 [이동 없음]을 고르면 기억한 이름이 목록에 보이고, [지우기]로 지운다.
- scrollUntilVisible:
    element: 'E2E Tomorrow Visit .*'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Tomorrow Visit .*'
- scrollUntilVisible:
    element: 'E2E Tomorrow Visit 이동 없음'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: 'E2E Tomorrow Visit 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: 'E2E Tomorrow Visit 이동 없음'
- scrollUntilVisible:
    element: 'E2E Tomorrow Visit 되돌리기'
    direction: DOWN
    timeout: 20000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Tomorrow Visit'
      STAGE: remembered
- tapOn:
    id: 'tabbar-places'
- extendedWaitUntil:
    visible: '자주 가는 곳을 알려주세요'
    timeout: 15000
- scrollUntilVisible:
    element: '이동 없음으로 기억한 일정'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: 'E2E Tomorrow Visit 이동 없음 지우기'
    direction: DOWN
    timeout: 20000
- assertVisible: 'E2E Tomorrow Visit'
- scroll
- takeScreenshot: 10-places-tab-skip-list
- tapOn: 'E2E Tomorrow Visit 이동 없음 지우기'
- extendedWaitUntil:
    notVisible: 'E2E Tomorrow Visit 이동 없음 지우기'
    timeout: 20000
- runScript:
    file: assert-skips.js
    env:
      SERVER_URL: ${SERVER_URL}
      NAME: 'E2E Tomorrow Visit'
      STAGE: forgotten
- takeScreenshot: 11-places-tab-skip-removed

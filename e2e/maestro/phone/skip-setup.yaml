# 첫 설정(1~5단계)을 모두 건너뛰어 아래 탭(오늘)에 닿는 공통 하위 flow. 건너뛰기 글자가 단계마다 달라('나중에 할게요'·'건너뛰기') 보이는 쪽을 누르고,
# 끝나면 알림 권한 창에 거부로 답한다. 오늘 탭의 제목 '오늘 일정'이 보이면 멈추고, 길이가 늘어나도(단계 추가) 최대 10번까지 따라간다.
appId: ${APP_ID}
---
- repeat:
    times: 10
    while:
      notVisible: '오늘 일정'
    commands:
      - runFlow:
          when:
            visible: '건너뛰기'
          commands:
            - tapOn: '건너뛰기'
      - runFlow:
          when:
            visible: '나중에 할게요'
          commands:
            - tapOn: '나중에 할게요'
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    file: notification-deny.yaml
- extendedWaitUntil:
    visible: '오늘 일정'
    timeout: 30000

# Expo Go 개발자 메뉴 안내를 닫고 우리 화면 제목을 기다리는 공통 하위 flow. 각 flow가 openLink 바로 뒤에 부른다.
#   SCREEN_TITLE  기다릴 우리 화면 제목(정규식 전체 일치)
# flow는 launchApp clearState로 시작해 Expo Go가 매번 첫 실행이라, 번들이 뜰 때 "This is the developer menu… Continue"
# 시트가 매번 화면을 덮는다. 시트는 번들이 뜬 뒤 올라오므로 openLink 직후에 확인하면 아직 없어서 놓친다.
# 그래서 제목이나 시트 중 먼저 뜨는 것을 기다리고, 움직임이 멈춘 뒤 시트·개발자 메뉴를 닫고 나서 제목을 확인한다.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: '(${SCREEN_TITLE}|Continue)'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: 'Go home'
    commands:
      - back
- extendedWaitUntil:
    visible: '${SCREEN_TITLE}'
    timeout: 30000

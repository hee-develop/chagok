# 4단계 차 연결. scripts/e2e-phone.sh 가 아래 env를 넣어 실행한다.
#   APP_ID      Expo Go 번들 ID (Android host.exp.exponent)
#   EXPO_URL    4단계 화면으로 바로 들어가는 Metro 주소 (exp://.../--/setup/pair-car)
#   SERVER_URL  호스트에서 본 서버 주소
# 에뮬레이터 카메라로는 차 화면 QR을 찍을 수 없어, 차 대신 서버에서 코드를 받아(issue-pairing-code.js) 번호로 넣는다.
appId: ${APP_ID}
env:
  CAR_ID: e2e-phone-car
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}

- runFlow:
    file: expo-dev-menu.yaml
    env:
      SCREEN_TITLE: '차와 연결해요'
- assertVisible: '5 / 5'
- assertVisible: 'QR 찍기'
- takeScreenshot: 01-pair-car

# 틀린 번호는 새 번호를 넣으라고 한다(서버 404).
- tapOn:
    id: 'pair-code-input'
- inputText: '000000'
- hideKeyboard
- tapOn: '연결하기'
- extendedWaitUntil:
    visible: '번호가 맞지 않거나 시간이 지났어요.*'
    timeout: 15000
- takeScreenshot: 02-invalid

# 차가 받은 번호를 넣으면 연결된다.
- runScript:
    file: issue-pairing-code.js
    env:
      SERVER_URL: ${SERVER_URL}
      CAR_ID: ${CAR_ID}
- tapOn:
    id: 'pair-code-input'
- eraseText: 10
- inputText: ${output.code}
- hideKeyboard
- tapOn: '연결하기'
- extendedWaitUntil:
    visible: '✓ 차와 연결됐어요'
    timeout: 15000
- assertVisible: '완료'
- takeScreenshot: 03-paired
- runScript:
    file: assert-paired.js
    env:
      SERVER_URL: ${SERVER_URL}
      CAR_ID: ${CAR_ID}

# 연결한 뒤 [완료]는 첫 설정을 끝낸 것으로 보고 오늘 탭으로 간다(3단계로 되돌아가지 않는다). 오늘 탭은 폰 토큰으로 서버(GET /pair)에 연결 상태를 묻는다.
- tapOn: '완료'
# 첫 설정 끝에서 알림 권한을 한 번 묻는다(정책 10.4). 허용으로 답한다.
- runFlow:
    file: notification-allow.yaml
- extendedWaitUntil:
    visible: '오늘 일정'
    timeout: 20000
- assertNotVisible: '5 / 5'
- extendedWaitUntil:
    visible: '✓ 차와 연결돼 있어요'
    timeout: 20000
- assertVisible: '.*에 연결했어요'
- takeScreenshot: 04-today-connected

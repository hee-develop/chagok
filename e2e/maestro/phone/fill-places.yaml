# 3단계의 실제 앱 -> 서버 저장 -> 차량 일정 응답 반영과 재진입 복원을 확인한다.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Go home'
    commands:
      - back
- extendedWaitUntil:
    visible: '장소가 빈 일정이 2개 있어요'
    timeout: 120000
- assertVisible: '3 / 4'
- assertVisible: '육전집 점심'
- takeScreenshot: 01-missing
- tapOn: '육전집 점심 장소 넣기'
- extendedWaitUntil:
    visible: '일정 장소 찾기'
    timeout: 15000
- inputText: '육전'
- extendedWaitUntil:
    visible: '.*광주 육전집.*'
    timeout: 15000
- takeScreenshot: 02-search
- tapOn: '.*광주 육전집.*'
- extendedWaitUntil:
    visible: '장소가 빈 일정이 1개 있어요'
    timeout: 15000
- assertVisible: '✓ 광주 육전집'
- takeScreenshot: 03-saved
- scrollUntilVisible:
    element: '치과 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: '치과 이동 없음'
- extendedWaitUntil:
    visible: '✓ 이동 없음'
    timeout: 15000
- takeScreenshot: 04-no-travel
- scrollUntilVisible:
    element: '일정 장소를 모두 확인했어요'
    direction: UP
    timeout: 20000
- runScript:
    file: assert-schedule-places.js
    env:
      SERVER_URL: ${SERVER_URL}
- tapOn: '다음'
- extendedWaitUntil:
    visible: '말 거는 방법'
    timeout: 15000
- assertVisible: '4 / 4'
- takeScreenshot: 05-next
- back
- extendedWaitUntil:
    visible: '일정 장소를 모두 확인했어요'
    timeout: 15000
- assertVisible: '✓ 광주 육전집'
- scrollUntilVisible:
    element: '✓ 이동 없음'
    direction: DOWN
    timeout: 20000
- takeScreenshot: 06-restored
- tapOn: '나중에 할게요'
- extendedWaitUntil:
    visible: '말 거는 방법'
    timeout: 15000

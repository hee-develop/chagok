# 3단계의 실제 앱 -> 서버 저장 -> 차량 일정 응답 반영과 재진입 복원을 확인한다.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}

# Expo Go 개발자 메뉴 안내를 닫고 우리 화면을 기다린다(expo-dev-menu.yaml 설명 참고).
- runFlow:
    file: expo-dev-menu.yaml
    env:
      SCREEN_TITLE: '장소가 빈 일정이 2개 있어요'
- assertVisible: '3 / 5'
- assertVisible: '육전집 점심'
- assertVisible: '✓ 광주 육전집'
- takeScreenshot: 01-missing
- scrollUntilVisible:
    element: '친구 약속 이동 없음'
    direction: DOWN
    timeout: 20000
- tapOn: '친구 약속 이동 없음'
- extendedWaitUntil:
    visible: '✓ 이동 없음'
    timeout: 15000
- takeScreenshot: 02-no-travel
- scrollUntilVisible:
    element: '장소가 빈 일정이 1개 있어요'
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: '치과 여기 맞아요'
    direction: DOWN
    timeout: 20000
# 버튼이 막 보일 때 기억한 장소 이름은 아래 푸터에 가려 있을 수 있어 한 번 더 내린다.
- scrollUntilVisible:
    element: '예시치과의원'
    direction: DOWN
    timeout: 20000
- assertVisible: ".*지난번 '치과' 일정.*"
- assertVisible: '예시치과의원'
- takeScreenshot: 03-remembered
- tapOn: '치과 여기 맞아요'
- extendedWaitUntil:
    visible: '✓ 예시치과의원'
    timeout: 15000
- takeScreenshot: 04-confirmed
- scrollUntilVisible:
    element: '일정 장소를 모두 확인했어요'
    direction: UP
    timeout: 20000
- runScript:
    file: assert-schedule-places.js
    env:
      SERVER_URL: ${SERVER_URL}
      STAGE: no-travel
- scrollUntilVisible:
    element: '친구 약속 장소 변경'
    direction: DOWN
    timeout: 20000
- tapOn: '친구 약속 장소 변경'
- extendedWaitUntil:
    visible: '일정 장소 찾기'
    timeout: 15000
- inputText: '육전'
- extendedWaitUntil:
    visible: '.*광주 육전집.*'
    timeout: 15000
- takeScreenshot: 05-search
- tapOn: '.*광주 육전집.*'
- extendedWaitUntil:
    notVisible: '✓ 이동 없음'
    timeout: 15000
- extendedWaitUntil:
    visible: '✓ 광주 육전집'
    timeout: 15000
- takeScreenshot: 06-changed
- runScript:
    file: assert-schedule-places.js
    env:
      SERVER_URL: ${SERVER_URL}
      STAGE: changed
- tapOn: '다음'
# 3단계 다음은 4단계 '말 거는 방법'이다(5단계 중 4단계). 연결 전이라 이 기기의 연결 전 버킷(E2E는 기본 자리)에 저장된다.
- extendedWaitUntil:
    visible: '말 거는 방법을 정해요'
    timeout: 15000
- assertVisible: '4 / 5'
- assertVisible: '플러스 모드'
- assertVisible: '늦을 때 연락'
- assertNotVisible: '화면 없이 음성만'
- extendedWaitUntil:
    visible: '문자는 내용을 채운 문자 창으로 열어 드려요.'
    timeout: 15000
- takeScreenshot: 07-talk
- tapOn:
    id: 'switch-plusMode'
- extendedWaitUntil:
    visible: '주행 중 늦어질 때 일정당 한 번 먼저 말해요.'
    timeout: 15000
- assertVisible:
    id: 'switch-plusMode'
    checked: true
- tapOn:
    id: 'switch-lateContact'
- extendedWaitUntil:
    visible: '늦을 것 같으면 연락할지 차가 물어봐요.*'
    timeout: 15000
- assertVisible:
    id: 'switch-lateContact'
    checked: true
- takeScreenshot: 07a-talk-on
- runScript:
    file: assert-settings.js
    env:
      SERVER_URL: ${SERVER_URL}
      EXPECT: 'plusMode=true,lateContact=true,voiceOnly=false'
# 한 번 더 누르면 꺼진다(원래대로 돌려 다음 flow에 남기지 않는다).
- tapOn:
    id: 'switch-plusMode'
- tapOn:
    id: 'switch-lateContact'
- extendedWaitUntil:
    visible: '켜면 주행 중 늦어질 때 일정당 한 번 먼저 말해요.'
    timeout: 15000
- runScript:
    file: assert-settings.js
    env:
      SERVER_URL: ${SERVER_URL}
      EXPECT: 'plusMode=false,lateContact=false,voiceOnly=false'
- tapOn: '다음'
- extendedWaitUntil:
    visible: '차와 연결해요'
    timeout: 15000
- assertVisible: '5 / 5'
- takeScreenshot: 07b-next
- back
- extendedWaitUntil:
    visible: '말 거는 방법을 정해요'
    timeout: 15000
- back
- extendedWaitUntil:
    visible: '나중에 할게요'
    timeout: 15000
- scrollUntilVisible:
    element: '✓ 예시치과의원'
    direction: DOWN
    timeout: 20000
- takeScreenshot: 08-restored
- tapOn: '나중에 할게요'
- extendedWaitUntil:
    visible: '말 거는 방법을 정해요'
    timeout: 15000
- assertVisible: '4 / 5'

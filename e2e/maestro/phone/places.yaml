# 2단계 자주 가는 곳. scripts/e2e-phone.sh 가 아래 env를 넣어 실행한다.
#   APP_ID      Expo Go 번들 ID (Android host.exp.exponent)
#   EXPO_URL    2단계 화면으로 바로 들어가는 Metro 주소 (exp://.../--/setup/places)
#   SERVER_URL  호스트에서 본 서버 주소
# assertVisible·tapOn 글자는 정규식 전체 일치라 [ ] ( ) + 는 \ 로 막는다.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}

# Expo Go 개발자 메뉴 안내를 닫고 우리 화면을 기다린다(expo-dev-menu.yaml 설명 참고).
- runFlow:
    file: expo-dev-menu.yaml
    env:
      SCREEN_TITLE: '자주 가는 곳을 알려주세요'
- assertVisible: '2 / 4'
- assertVisible: '\[집 주소\]'
- assertVisible: '\[회사 주소\]'
- assertVisible: '캘린더에서 자주 나온 곳'
- assertVisible: '체육관 추가'
- assertVisible: '광주-기아 챔피언스필드 추가'
- takeScreenshot: 01-initial
- runScript:
    file: assert-favorites.js
    env:
      SERVER_URL: ${SERVER_URL}
      EXPECT_HOME: ''
      EXPECT_WORK: ''
      EXPECT_OTHERS: ''

# 집 줄 -> 검색 -> 고르기 -> 돌아와 집 줄에 표시
- tapOn: '집, 주소 미설정'
- extendedWaitUntil:
    visible: '집 주소 찾기'
    timeout: 15000
- takeScreenshot: 02-search-empty

# 결과가 10개일 때 키보드를 연 채로 목록을 끝까지 내려 마지막 결과와 취소에 닿는지 확인한다(스크롤을 시작하면 키보드가 내려간다)
- inputText: '광주'
- extendedWaitUntil:
    visible: '.*광주 육전집.*'
    timeout: 15000
- takeScreenshot: 02b-search-many-first
- scrollUntilVisible:
    element: '.*광주송정역.*'
    direction: DOWN
    timeout: 20000
- assertVisible: '취소'
- takeScreenshot: 02c-search-many-last
# 검색칸도 스크롤 안에 있어 끝까지 내리면 화면 위로 사라진다. 다시 올려 검색칸을 누르고 글자를 지운다.
- scrollUntilVisible:
    element: '광주'
    direction: UP
    timeout: 20000
- tapOn: '광주'
- eraseText: 10

- inputText: '아파트'
- extendedWaitUntil:
    visible: '.*예시 아파트 101동.*'
    timeout: 15000
- takeScreenshot: 03-search-results
- tapOn: '.*예시 아파트 101동.*'
- extendedWaitUntil:
    visible: '자주 가는 곳을 알려주세요'
    timeout: 15000
- assertVisible: '.*예시 아파트 101동.*'
- assertNotVisible: '\[집 주소\]'
- assertVisible: '\[회사 주소\]'
- takeScreenshot: 04-home-saved

# 추천 '체육관' 추가 -> 추가된 장소 줄로 바뀌고 추천에서 빠진다
- tapOn: '체육관 추가'
- extendedWaitUntil:
    notVisible: '체육관 추가'
    timeout: 15000
- assertVisible: '광주 서구 운동로 7.*'
- assertVisible: '광주-기아 챔피언스필드 추가'
- takeScreenshot: 05-gym-added

# 장소 직접 추가 -> 검색 -> 고르기
- tapOn: '\+ 장소 직접 추가'
- extendedWaitUntil:
    visible: '장소 찾기'
    timeout: 15000
- inputText: '송정'
- extendedWaitUntil:
    visible: '.*광주송정역.*'
    timeout: 15000
- tapOn: '.*광주송정역.*'
- extendedWaitUntil:
    visible: '자주 가는 곳을 알려주세요'
    timeout: 15000
- assertVisible: '광주 광산구 상무대로 201'
- takeScreenshot: 06-station-added

- runScript:
    file: assert-favorites.js
    env:
      SERVER_URL: ${SERVER_URL}
      EXPECT_HOME: 'mock-home-apt'
      EXPECT_WORK: ''
      EXPECT_OTHERS: 'mock-gym,mock-station'

# 다음 -> 3단계 자리 화면
- tapOn: '다음'
- extendedWaitUntil:
    visible: '장소가 빈 일정이 2개 있어요'
    timeout: 15000
- assertVisible: '3 / 4'
- takeScreenshot: 07-fill-places
